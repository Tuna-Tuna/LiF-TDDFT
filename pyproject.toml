[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lif-tddft"
version = "0.3.0"
description = "Reproducible F-/LiF(100) RT-TDDFT and sequential charge-state workflow"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "Jinja2>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
